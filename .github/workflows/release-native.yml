# Generated from scripts/ci/workflows.mjs; run pnpm ci:generate.
name: "Publish Native Prerelease"
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful three-platform Build Native Candidates run ID"
        type: "string"
        required: true
      replace_release_id:
        description: "Optional exact manual prerelease ID to migrate to the bot; changes Release ID"
        type: "string"
        required: false
        default: ""
      recovery_run_id:
        description: "Optional exact prior Native publication run with the original release backup after deletion"
        type: "string"
        required: false
        default: ""
permissions:
  contents: "read"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: "native-release"
  cancel-in-progress: false
jobs:
  prepare:
    name: "Authorize exact main source"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    permissions:
      contents: "read"
      actions: "read"
    outputs:
      source_commit: "${{ steps.source.outputs.source_commit }}"
    steps:
      - name: "Checkout exact source"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - name: "Setup Node"
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: 24
      - name: "Validate source, version and successful candidate run"
        id: "source"
        env:
          GH_TOKEN: "${{ github.token }}"
          NATIVE_CANDIDATE_RUN_ID: "${{ inputs.candidate_run_id }}"
          NATIVE_REPLACE_RELEASE_ID: "${{ inputs.replace_release_id }}"
          NATIVE_RECOVERY_RUN_ID: "${{ inputs.recovery_run_id }}"
        run: "node scripts/publish-native-release.mjs prepare"
  quality:
    name: "Required source validation"
    needs: "prepare"
    uses: "./.github/workflows/ci-full.yml"
    with:
      source_commit: "${{ needs.prepare.outputs.source_commit }}"
    permissions:
      contents: "read"
  stage:
    name: "Verify and preserve release inputs"
    needs:
      - "prepare"
      - "quality"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    permissions:
      contents: "read"
      actions: "read"
    outputs:
      bundle_attempt: "${{ steps.bundle.outputs.bundle_attempt }}"
    steps:
      - name: "Checkout exact source"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - name: "Setup Node"
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: 24
      - name: "Authenticate artifacts and stage complete release"
        id: "bundle"
        env:
          GH_TOKEN: "${{ github.token }}"
          NATIVE_CANDIDATE_RUN_ID: "${{ inputs.candidate_run_id }}"
          NATIVE_REPLACE_RELEASE_ID: "${{ inputs.replace_release_id }}"
          NATIVE_RECOVERY_RUN_ID: "${{ inputs.recovery_run_id }}"
          NATIVE_EXPECTED_SOURCE_COMMIT: "${{ needs.prepare.outputs.source_commit }}"
        run: "node scripts/publish-native-release.mjs stage"
      - name: "Preserve verified bundle and any previous release before writes"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "native-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "artifacts/native-release/"
          if-no-files-found: "error"
          retention-days: 14
  publish:
    name: "Publish verified prerelease as bot"
    needs:
      - "prepare"
      - "quality"
      - "stage"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    permissions:
      contents: "write"
      actions: "read"
    steps:
      - name: "Checkout exact source"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - name: "Setup Node"
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: 24
      - name: "Download immutable verified release bundle"
        uses: "actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131"
        with:
          name: "native-release-bundle-${{ github.run_id }}-${{ needs.stage.outputs.bundle_attempt }}"
          path: "artifacts/native-release/"
      - name: "Create or resume exact bot draft, verify downloads and publish"
        env:
          GH_TOKEN: "${{ github.token }}"
          NATIVE_CANDIDATE_RUN_ID: "${{ inputs.candidate_run_id }}"
          NATIVE_REPLACE_RELEASE_ID: "${{ inputs.replace_release_id }}"
          NATIVE_RECOVERY_RUN_ID: "${{ inputs.recovery_run_id }}"
          NATIVE_EXPECTED_SOURCE_COMMIT: "${{ needs.prepare.outputs.source_commit }}"
        run: "node scripts/publish-native-release.mjs publish"
      - name: "Archive exact publication result"
        if: "${{ always() }}"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "native-publication-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "artifacts/native-publication.json"
          if-no-files-found: "error"
          retention-days: 14
