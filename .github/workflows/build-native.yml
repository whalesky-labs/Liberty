# Generated from scripts/ci/workflows.mjs; run pnpm ci:generate.
name: "Build Native Candidates"
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Candidate target"
        type: "choice"
        required: true
        default: "all"
        options:
          - "all"
          - "darwin-aarch64"
          - "darwin-x64"
          - "windows-x64"
  workflow_call:
    inputs:
      target:
        description: "Candidate target"
        type: "string"
        required: false
        default: "all"
permissions:
  contents: "read"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: "go1.27.4"
  GOFLAGS: "-mod=readonly"
concurrency:
  group: "native-candidate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  quality:
    name: "Required complete validation"
    uses: "./.github/workflows/ci-full.yml"
    permissions:
      contents: "read"
  select:
    name: "Select candidate target"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    outputs:
      matrix: "${{ steps.target.outputs.matrix }}"
    steps:
      - name: "Setup Node"
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: 24
      - name: "Validate requested target"
        id: "target"
        shell: "bash"
        env:
          NATIVE_TARGET: "${{ inputs.target }}"
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const targets = [{"target":"darwin-aarch64","runner":"macos-latest","system":"darwin","arch":"arm64"},{"target":"darwin-x64","runner":"macos-15-intel","system":"darwin","arch":"amd64"},{"target":"windows-x64","runner":"windows-2022","system":"windows","arch":"amd64"}];
          const selected = process.env.NATIVE_TARGET === 'all' ? targets : targets.filter(target => target.target === process.env.NATIVE_TARGET);
          if (!selected.length) throw new Error('Unsupported candidate target');
          appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({ include: selected }) + '\n');
          JS
  build:
    name: "Candidate (${{ matrix.target }})"
    needs:
      - "quality"
      - "select"
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.matrix) }}"
    steps:
      - name: "Checkout exact source"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: "Setup Node"
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: 24
      - name: "Setup Go"
        uses: "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16"
        with:
          go-version: "1.27.4"
          cache-dependency-path: "apps/native/go.sum"
      - name: "Package and execute extracted candidate"
        shell: "bash"
        env:
          NATIVE_TARGET: "${{ matrix.target }}"
        run: "node scripts/package-native.mjs --target \"$NATIVE_TARGET\" --verify-host"
      - name: "Verify exact archive, manifest and checksums"
        shell: "bash"
        env:
          NATIVE_TARGET: "${{ matrix.target }}"
          NATIVE_COMMIT: "${{ github.sha }}"
        run: "node scripts/check-native-release-policy.mjs verify-artifacts --target \"$NATIVE_TARGET\" --commit \"$NATIVE_COMMIT\" --output \"artifacts/native/$NATIVE_TARGET\""
      - name: "Upload verified unsigned candidate"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
        with:
          name: "liberty-native-candidate-${{ matrix.target }}-${{ github.sha }}"
          path: "artifacts/native/${{ matrix.target }}/"
          if-no-files-found: "error"
          retention-days: 14
