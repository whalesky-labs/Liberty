# Generated from scripts/ci/workflows.mjs; run pnpm ci:generate.
name: "Validation Suite"
on:
  workflow_call:
    inputs:
      suite:
        description: "Closed validation suite identifier"
        required: true
        type: "string"
permissions:
  contents: "read"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: "go1.27.4"
  GOFLAGS: "-mod=readonly"
jobs:
  run:
    name: "${{ inputs.suite }}"
    runs-on: "${{ inputs.suite == 'target-arm' && 'macos-latest' || inputs.suite == 'target-intel' && 'macos-15-intel' || startsWith(inputs.suite, 'windows-') && 'windows-2022' || inputs.suite == 'target-windows' && 'windows-2022' || 'ubuntu-22.04' }}"
    timeout-minutes: 60
    steps:
      - name: "Checkout exact source"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: "Setup Node"
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: 24
      - name: "Setup Go"
        uses: "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16"
        with:
          go-version: "1.27.4"
          cache-dependency-path: "apps/native/go.sum"
        if: "${{ contains(fromJSON('[\"native\",\"policy\",\"compat\",\"race\",\"matrix\",\"target-arm\",\"target-intel\",\"target-windows\",\"security\"]'), inputs.suite) }}"
      - name: "Setup Python"
        if: "${{ contains(fromJSON('[\"python\",\"rust\"]'), inputs.suite) }}"
        uses: "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1"
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "python/funasr-runner/requirements-dev-lock.txt"
      - name: "Setup Rust"
        if: "${{ contains(fromJSON('[\"rust\",\"windows-rust\",\"security\"]'), inputs.suite) }}"
        uses: "dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88"
        with:
          toolchain: "1.94.0"
          components: "clippy,rustfmt"
      - name: "Rust cache"
        if: "${{ contains(fromJSON('[\"rust\",\"windows-rust\",\"security\"]'), inputs.suite) }}"
        uses: "swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae"
        with:
          workspaces: ". -> target"
          key: "${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}"
      - name: "Linux desktop libraries"
        if: "${{ inputs.suite == 'rust' }}"
        shell: "bash"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: "Pinned package manager"
        if: "${{ contains(fromJSON('[\"native\",\"python\",\"frontend\",\"policy\",\"compat\",\"matrix\",\"security\"]'), inputs.suite) }}"
        shell: "bash"
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          test "$(pnpm --version)" = "10.30.3"
          pnpm config set store-dir "$RUNNER_TEMP/liberty-pnpm-store"
      - name: "Node dependency cache"
        if: "${{ contains(fromJSON('[\"native\",\"python\",\"frontend\",\"policy\",\"compat\",\"matrix\",\"security\"]'), inputs.suite) }}"
        uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830"
        with:
          path: "${{ runner.temp }}/liberty-pnpm-store"
          key: "pnpm-${{ runner.os }}-${{ runner.arch }}-10.30.3-${{ hashFiles('pnpm-lock.yaml') }}"
      - name: "Install root tooling"
        if: "${{ contains(fromJSON('[\"native\",\"python\",\"policy\",\"compat\",\"matrix\",\"security\"]'), inputs.suite) }}"
        run: "pnpm --filter liberty-workspace install --frozen-lockfile --ignore-scripts"
      - name: "Install frontend dependencies"
        if: "${{ inputs.suite == 'frontend' }}"
        run: "pnpm install --frozen-lockfile"
      - name: "Install authenticated security scanners"
        if: "${{ inputs.suite == 'security' }}"
        shell: "bash"
        run: "bash scripts/ci/install-security-tools.sh"
      - name: "Execute required suite"
        env:
          LIBERTY_CI_SUITE: "${{ inputs.suite }}"
        run: "node scripts/ci/run.mjs"
      - name: "Archive verified inventories"
        if: "${{ inputs.suite == 'security' }}"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
        with:
          name: "liberty-inventories-${{ github.sha }}"
          path: "artifacts/sbom/"
          if-no-files-found: "error"
          retention-days: 14
