# Generated from scripts/ci/workflows.mjs; run pnpm ci:generate.
name: "Quality Gate"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      mode:
        description: "On-demand validation"
        required: true
        type: "choice"
        default: "full"
        options:
          - "full"
          - "security"
permissions:
  contents: "read"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  plan:
    name: "Select checks"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    permissions:
      contents: "read"
      actions: "read"
    outputs:
      plan: "${{ steps.select.outputs.plan }}"
      full: "${{ steps.select.outputs.full }}"
      matrix: "${{ steps.select.outputs.matrix }}"
    steps:
      - name: "Checkout exact source"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - name: "Setup Node"
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: 24
      - name: "Classify with trusted base rules"
        id: "select"
        shell: "bash"
        env:
          TRUSTED_BASE: "${{ github.event.pull_request.base.sha || github.event.before || github.event_name == 'workflow_dispatch' && github.sha }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          if [[ "$TRUSTED_BASE" =~ ^[a-f0-9]{40}$ ]] && git show "$TRUSTED_BASE:scripts/ci/plan.mjs" > "$RUNNER_TEMP/liberty-ci-plan.mjs"; then
            node "$RUNNER_TEMP/liberty-ci-plan.mjs"
          else
            node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const plan = { format: 1, head: process.env.GITHUB_SHA, base: null, mode: 'full', full: true, suites: ["docs","native","python","frontend","rust","policy","compat","race","matrix","target-arm","target-intel","target-windows","windows-rust","windows-release","security"], reasons: ['trusted-planner-unavailable'], changedFiles: 0 };
          appendFileSync(process.env.GITHUB_OUTPUT, 'plan=' + JSON.stringify(plan) + '\nfull=true\nmatrix={"suite":["docs"]}\n');
          console.log(JSON.stringify(plan, null, 2));
          JS
          fi
  checks:
    name: "Selected (${{ matrix.suite }})"
    needs: "plan"
    if: "${{ needs.plan.outputs.full == 'false' }}"
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.plan.outputs.matrix) }}"
    uses: "./.github/workflows/ci-suite.yml"
    with:
      suite: "${{ matrix.suite }}"
    permissions:
      contents: "read"
  full:
    name: "Full validation"
    needs: "plan"
    if: "${{ needs.plan.outputs.full == 'true' }}"
    uses: "./.github/workflows/ci-full.yml"
    permissions:
      contents: "read"
  gate:
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'security' && 'security-gate' || 'ci-gate' }}"
    if: "${{ always() }}"
    needs:
      - "plan"
      - "checks"
      - "full"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "Checkout exact source"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: "Setup Node"
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: 24
      - name: "Require every selected check"
        env:
          CI_PLAN: "${{ needs.plan.outputs.plan }}"
          CI_RESULTS: "{\"plan\":\"${{ needs.plan.result }}\",\"checks\":\"${{ needs.checks.result }}\",\"full\":\"${{ needs.full.result }}\"}"
        run: "node scripts/ci/gate.mjs"
